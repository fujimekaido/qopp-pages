:root{
  --canvas:#101216;
  --accent:#e3a94f;
  --text-primary:#f2f0ea;
  --text-secondary:#a2a8b4;
  --hairline:rgba(162,168,180,.16);
  --ease:cubic-bezier(.22,.61,.2,1);
  --display:'Montserrat',sans-serif;
  --body:'Montserrat',sans-serif;
  --mono:'Montserrat',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip}
body{
  background:var(--canvas);color:var(--text-primary);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;flex-direction:column;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
a{color:inherit}

/* шапка */
.top{position:absolute;top:0;left:0;right:0;z-index:5;padding:16px clamp(20px,4vw,56px)}
.top img{height:44px;width:auto;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}

/* сцена */
.err{
  position:relative;flex:1;display:flex;align-items:flex-end;
  min-height:min(72svh,620px);overflow:hidden;
}
.err-photo{position:absolute;inset:0}
.err-photo img{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block}
.err-scrim{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 70% at 50% 30%,transparent 30%,rgba(8,9,12,.5) 100%),
    linear-gradient(180deg,rgba(8,9,12,.55) 0%,rgba(8,9,12,.08) 34%,rgba(16,18,22,.86) 82%,var(--canvas) 100%);
}
.err-copy{
  position:relative;z-index:2;width:100%;
  max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px) clamp(26px,4.4vh,48px);
}
.err-copy .kicker{
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);
}
.err-copy h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(25px,3.6vw,44px);letter-spacing:.01em;line-height:1.12;max-width:20ch;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.err-copy p{color:var(--text-secondary);margin-top:14px;max-width:46ch;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:clamp(22px,3.4vh,34px)}
.pbtn{
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  color:#f6f5f1;text-decoration:none;white-space:nowrap;
  padding:13px 30px;border-radius:15px;
  background:
    linear-gradient(168deg,rgba(52,58,72,.74),rgba(17,19,25,.9) 62%),
    radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.3),transparent 58%);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.45),inset 0 0 24px rgba(255,255,255,.07),0 10px 26px rgba(8,9,12,.4);
  transition:border-color .45s var(--ease),box-shadow .45s var(--ease),transform .45s var(--ease),background .45s var(--ease);
}
.pbtn::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(108deg,transparent 24%,rgba(255,255,255,.28) 46%,transparent 66%);
  transform:translateX(-135%);transition:transform .85s var(--ease);
}
.pbtn:hover::before{transform:translateX(135%)}
.pbtn:hover{
  border-color:rgba(255,255,255,.4);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.46),inset 0 -1px 0 rgba(0,0,0,.5),inset 0 0 28px rgba(255,255,255,.1),0 16px 34px rgba(8,9,12,.5);
}
.pbtn-gold{color:var(--accent);border-color:rgba(227,169,79,.55)}
.pbtn-gold:hover{border-color:rgba(240,196,120,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.46),inset 0 -1px 0 rgba(0,0,0,.5),inset 0 0 28px rgba(227,169,79,.16),0 16px 34px rgba(227,169,79,.26)}
.pbtn svg{position:relative;transition:transform .45s var(--ease)}
.pbtn:hover svg{transform:translateX(4px)}

/* нижняя навигация */
.err-nav{
  border-top:1px solid var(--hairline);
  padding:clamp(22px,3.4vh,34px) clamp(20px,5vw,56px);
}
.err-nav .in{
  max-width:1180px;margin:0 auto;
  display:flex;flex-wrap:wrap;gap:10px 34px;align-items:baseline;
}
.err-nav b{
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-secondary);margin-right:6px;
}
.err-nav a{
  font-size:15px;color:var(--text-secondary);text-decoration:none;
  transition:color .3s var(--ease);
}
.err-nav a:hover{color:var(--text-primary)}
/* сбой (агрессивная версия): слои-полосы и блоки, сдвиг каналов, развёртка, шум, рывки кадра, скрэмбл заголовка */
.gl-layer,.gl-jp,.gl-scan,.gl-noise,.gl-bar{transition:opacity .12s linear}
.err-photo,.err-copy{transition:transform .14s ease-out}
.gl-layer{position:absolute;inset:0;background:url('assets/err-404.jpg') center 32%/cover no-repeat;opacity:0;pointer-events:none;will-change:transform,clip-path}
.gl-scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 2px,transparent 2px 5px);mix-blend-mode:multiply}
.gl-noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;image-rendering:pixelated;mix-blend-mode:overlay}
.gl-bar{position:absolute;left:0;right:0;height:3px;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay;box-shadow:0 0 24px 6px rgba(255,255,255,.35)}
.gl-jp{position:absolute;z-index:3;pointer-events:none;opacity:0;white-space:nowrap;font-family:'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;font-weight:800;letter-spacing:.18em;line-height:1;mix-blend-mode:screen;text-shadow:3px 0 #ff2d55,-3px 0 #00e5ff}
.err-photo{will-change:transform,filter}
.err-copy h1{position:relative}
.err-copy h1::before,.err-copy h1::after{content:attr(data-t);position:absolute;inset:0;opacity:0;pointer-events:none}
.err-copy h1::before{color:#ff2d55}
.err-copy h1::after{color:#00e5ff}
.err.glitch .err-copy h1::before{opacity:.9;transform:translate(var(--gx,8px),var(--gy,0));clip-path:inset(var(--c1,10%) 0 var(--c2,60%) 0)}
.err.glitch .err-copy h1::after{opacity:.9;transform:translate(calc(var(--gx,8px)*-1),calc(var(--gy,0px)*-1));clip-path:inset(var(--c3,55%) 0 var(--c4,12%) 0)}
.err.glitch .err-copy{transform:translate(var(--tx,0),var(--ty,0)) skewX(var(--sk,0deg))}
.err.glitch .err-copy p{opacity:var(--po,1);letter-spacing:var(--pl,normal)}
@media (max-width:720px){
  .err{min-height:56svh}
  .err-copy p{font-size:15.5px}
  .acts .pbtn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
'use strict';
/* сбой, спокойная версия: 3-6 смен кадра в секунду, без полноэкранных вспышек, инверсии и пересвета,
   яркость помех постоянная внутри серии (безопасность при светочувствительности, порог WCAG 3 вспышки в секунду). Выключено при prefers-reduced-motion и на скрытой вкладке. */
(()=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const root=document.querySelector('.err'),photo=document.querySelector('.err-photo'),scrim=document.querySelector('.err-scrim'),h1=document.querySelector('.err-copy h1');
  if(!root||!photo||!h1)return;
  const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.round(R(a,b)),P=p=>Math.random()<p,pick=a=>a[RI(0,a.length-1)];
  const N=9,layers=[];
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='gl-layer';d.setAttribute('aria-hidden','true');root.insertBefore(d,scrim);layers.push(d)}
  const scan=document.createElement('div');scan.className='gl-scan';root.insertBefore(scan,scrim);
  const bar=document.createElement('div');bar.className='gl-bar';root.insertBefore(bar,scrim);
  const nz=document.createElement('canvas');nz.className='gl-noise';nz.width=160;nz.height=90;root.insertBefore(nz,scrim);
  const nx=nz.getContext('2d'),nd=nx.createImageData(160,90);
  const noise=()=>{const d=nd.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}nx.putImageData(nd,0,0)};
  const JP=['\u30a8\u30e9\u30fc 404','\u30da\u30fc\u30b8\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093','\u4fe1\u53f7\u306a\u3057','\u30c7\u30fc\u30bf\u7834\u640d','\u8aad\u307f\u8fbc\u307f\u5931\u6557','\u30e1\u30e2\u30ea','\u63a5\u7d9a\u30a8\u30e9\u30fc','\u518d\u8d77\u52d5','\u8b66\u544a','\u30b7\u30b9\u30c6\u30e0\u7570\u5e38','\u8a18\u61b6','\u30ce\u30a4\u30ba'];
  const jps=[];for(let i=0;i<4;i++){const d=document.createElement('div');d.className='gl-jp';d.setAttribute('aria-hidden','true');d.lang='ja';root.insertBefore(d,scrim.nextSibling);jps.push(d)}
  const jp=(el,big)=>{
    el.textContent=P(.3)?pick(JP)+' '+pick(JP):pick(JP);
    el.style.left=R(2,70)+'%';el.style.top=R(6,84)+'%';
    el.style.fontSize=(P(.25)?R(44,big?120:84):R(13,34))+'px';
    el.style.writingMode=P(.3)?'vertical-rl':'horizontal-tb';
    el.style.color=pick(['#fff','#fff','#ff2d55','#00e5ff','#e3a94f']);
    el.style.transform='translateX('+R(-14,14)+'px) skewX('+R(-12,12)+'deg)';
    el.style.clipPath=P(.4)?'inset('+R(0,40)+'% 0 '+R(0,40)+'% 0)':'none';
    el.style.opacity=R(.45,1);
  };
  const FILTERS=['none','hue-rotate(90deg) saturate(2)','hue-rotate(200deg) saturate(2.5)','sepia(1) saturate(4) hue-rotate(-30deg)','grayscale(1) contrast(1.3)','saturate(3) hue-rotate(300deg)'];
  const BLENDS=['normal','screen','lighten','hard-light'];
  const TEXT=h1.dataset.t,GLYPHS=[...'#%&@$0123456789ABCDEF/|<>_=+*','\u2591','\u2592','\u2593','\u2588','\u25A0',...'\u30a2\u30a8\u30ab\u30b5\u30bf\u30ca\u30cf\u30de\u30e9\u30ef\u30f3\u30e1\u30e2\u30ea'];
  const scramble=k=>{let o='';for(const ch of TEXT)o+=(ch!==' '&&P(k))?pick(GLYPHS):ch;h1.textContent=o;h1.dataset.t=o};
  const restore=()=>{h1.textContent=TEXT;h1.dataset.t=TEXT};
  function slice(el,big){
    if(P(.3)){ /* блок: режем по обеим осям, как битый макроблок видео */
      const x=R(0,80),y=R(0,80),w=R(6,big?30:18),h=R(4,big?20:11);
      el.style.clipPath='inset('+y+'% '+Math.max(0,100-x-w)+'% '+Math.max(0,100-y-h)+'% '+x+'%)';
      el.style.transform='translate('+R(-45,45)+'px,'+R(-18,18)+'px) scale('+R(1,1.06)+')';
    }else{ /* полоса во всю ширину */
      const y=R(0,92),h=R(1,big?14:8);
      el.style.clipPath='inset('+y+'% 0 '+Math.max(0,100-y-h)+'% 0)';
      el.style.transform='translateX('+R(-1,1)*(big?90:42)+'px)'+(P(.2)?' scaleX('+R(1.02,1.15)+')':'');
    }
    el.style.filter=pick(FILTERS);el.style.mixBlendMode=pick(BLENDS);el.style.opacity=R(.4,.85);
  }
  const clear=()=>{
    layers.forEach(l=>{l.style.opacity=0});jps.forEach(l=>{l.style.opacity=0});scan.style.opacity=0;bar.style.opacity=0;nz.style.opacity=0;
    photo.style.transform='';photo.style.filter='';root.style.filter='';root.classList.remove('glitch');restore();
    ['--tx','--ty','--sk','--po','--pl'].forEach(v=>root.style.removeProperty(v));
  };
  let lastFlash=-9999;
  function burst(){
    if(document.hidden){setTimeout(burst,1200);return}
    const big=P(.15);let n=big?RI(4,6):RI(2,3),flashed=false;
    root.classList.add('glitch');
    const frame=()=>{
      const active=RI(big?3:1,big?6:3);
      layers.forEach((l,i)=>{if(i<active)slice(l,big);else l.style.opacity=0});
      /* кадр целиком: рывок, срыв развёртки, перекос */
      photo.style.transform=P(.45)?'translate('+R(-1,1)*(big?22:8)+'px,'+(P(.15)?R(-1,1)*(big?50:18):R(-3,3))+'px) skewX('+R(-1,1)*(big?3:1)+'deg) scale('+R(1,big?1.04:1.015)+')':'';
      photo.style.filter=P(.2)?pick(FILTERS):'';
      /* одна полноэкранная вспышка на серию, не больше */
      root.style.filter='';
      scan.style.opacity=.28;scan.style.transform='translateY('+RI(-4,4)+'px)';
      noise();nz.style.opacity=.14;
      if(P(.35)){bar.style.top=R(0,100)+'%';bar.style.height=RI(1,4)+'px';bar.style.opacity=R(.2,.45)}else bar.style.opacity=0;
      /* японские надписи */
      jps.forEach((el,i)=>{if(i<(big?4:2)&&P(.7))jp(el,big);else el.style.opacity=0});
      /* текст */
      root.style.setProperty('--gx',R(2,big?13:7)+'px');root.style.setProperty('--gy',R(-5,5)+'px');
      root.style.setProperty('--c1',R(0,45)+'%');root.style.setProperty('--c2',R(30,70)+'%');
      root.style.setProperty('--c3',R(35,75)+'%');root.style.setProperty('--c4',R(0,30)+'%');
      root.style.setProperty('--tx',(P(.4)?R(-1,1)*(big?14:5):0)+'px');root.style.setProperty('--ty',(P(.25)?R(-4,4):0)+'px');
      root.style.setProperty('--sk',(P(.3)?R(-1,1)*(big?6:2.5):0)+'deg');
